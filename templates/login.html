<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 1.5rem; color: #38bdf8; }
        input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; text-align: center; }
        button { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; background: #0284c7; color: white; cursor: pointer; font-weight: bold; }
        .error { color: #f87171; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 لوحة تحكم البوت</h2>
        <form method="POST" action="/login">
            <input type="password" name="password" placeholder="أدخل كلمة السر" required>
            <button type="submit">دخول</button>
        </form>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
